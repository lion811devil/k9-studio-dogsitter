<!doctype html>

<head>

  <title>K9 Studio Dogsitter</title>

<body>
<script>
(function(){
  var parts=location.pathname.split('/').filter(Boolean);
  var base='/'+(parts[0]||'')+'/';
  location.replace(base+location.search+location.hash);
})();
</script>
